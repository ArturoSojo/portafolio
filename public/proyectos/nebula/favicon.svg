<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nébula">
  <!-- El destello va DIBUJADO COMO TRAZADO y no como <text>✦</text>: un
       favicon con texto depende de que el sistema tenga esa fuente y de cómo
       decida centrar el glifo, así que el mismo icono salía descuadrado en
       Windows y en blanco en algunos Android. Un path se ve igual en todas
       partes y a 16 px, que es donde de verdad se mira. -->
  <defs>
    <linearGradient id="n" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0E1D"/>
  <circle cx="46" cy="17" r="1.8" fill="#F2F4FF" opacity="0.75"/>
  <circle cx="17" cy="45" r="1.4" fill="#F2F4FF" opacity="0.55"/>
  <circle cx="49" cy="45" r="1" fill="#22D3EE" opacity="0.7"/>
  <path
    d="M32 9c1.9 12.6 8.5 19.2 21.1 21.1C40.5 32 33.9 38.6 32 51.2 30.1 38.6 23.5 32 10.9 30.1 23.5 28.2 30.1 21.6 32 9Z"
    fill="url(#n)"/>
</svg>
